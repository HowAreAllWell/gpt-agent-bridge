<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Bridge 完成通知</title><link rel="stylesheet" href="popup.css"></head>
<body>
<h1>Bridge 完成通知</h1>
<label>本地项目 <select id="project"><option value="">选择项目</option></select></label>
<p id="destination">接收 Chat：尚未选择项目</p>
<p id="automatic-status" role="status">读取状态…</p>
<label><input id="automatic" type="checkbox">允许向当前 Chat 自动发送完成提醒</label>
<div class="actions"><button id="enable">绑定当前 Chat 并启用</button><button id="disable">停用</button></div>
<p id="feedback" role="status"></p>
<details id="diagnostics"><summary>诊断与安全恢复</summary>
<p>操作仅作用于所选项目。结果未知时先核对收件，不重发；停用和解除绑定都保留历史。</p>
<button id="verify">核对已尝试通知的收件</button>
<button id="inspect">检查页面，不填字、不发送</button>
<button id="bind">仅重新绑定当前 Chat</button><button id="unbind">解除绑定并停用</button>
<pre id="status"></pre>
<label>结束已证实点击前中止的通知<input id="work-marker" placeholder="完整 batch-… 或旧 work-… 编号"></label>
<button id="close_delivery">按证据结束，保留记录</button>
<p>此操作不表示收到消息；不能结束真正不确定的提交，也不能重发它。</p>
<label>发送延迟<select id="delay"><option value="0">不额外延迟</option><option value="60000">约 60 秒后尝试</option></select></label>
<details><summary>旧合成诊断</summary>
<p>不接真实工作。仅原项目支持；自动通知或未知尝试未结束时不能建立试验。</p>
<pre id="preview"></pre>
<label><input id="armed" type="checkbox">授权本次合成试验</label>
<button id="arm" disabled>建立编号并尝试一次</button>
<button id="retry">仅重试未尝试事件</button>
<button id="cancel">取消未尝试或结束已证实点击前中止的试验</button>
<label>仅在 Chat 中亲眼看到同编号回复后确认<input id="marker" placeholder="完整 test-… 编号" autocomplete="off"></label>
<button id="confirm">我已看到该编号回复</button>
</details></details>
<script type="module" src="popup.js"></script></body></html>
